<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VeriFly - Login</title>
    <link rel="stylesheet" href="csslogin.css">
    <!-- Fontes Archivo e Barlow -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>

    <main class="login-card">
        <header class="card-header">
            <img src="imagens/logofundoazul.jpg" alt="Logo VeriFly" class="logo">
        </header>

    
        <div class="card-body">
            <h1 class="title">SEJA BEM VINDO AO VERIFLY!</h1>
            <p class="subtitle">Sistema de monitoramento de voos</p>

            <form action="#" method="POST">
                <div class="form-group">
                    <label for="usuario">Usuário</label>
                    <input type="email" id="usuario" name="usuario" value="atendente@agencia.com.br" placeholder="atendente@agencia.com.br" required>
                </div>

                
                <div class="form-group">
                    <label for="senha">Senha</label>
                    <div class="password-wrapper">
                        <input type="password" id="senha" name="senha" value="••••••••" placeholder="••••••••" required>
                        <button type="button" class="btn-toggle-eye" aria-label="Mostrar/Ocultar Senha">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                        </button>
                    </div>
                </div>

                
                <div class="cloudflare-card">
                    <div class="cf-check">
                        <input type="checkbox" id="cf-turnstile">
                        <label for="cf-turnstile">Confirme que você é humano</label>
                    </div>
                    <div class="cf-meta">
                        <svg class="shield-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                        </svg>
                        <span>Protegido por Cloudflare · Privacidade · Termos</span>
                    </div>
                </div>

                
                <button type="submit" class="btn-submit">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
                    </svg>
                    ENTRAR
                </button>
            </form>

            <footer class="card-footer">
                Conexão protegida por Cloudflare - VeriFly © 2026
            </footer>
        </div>
    </main>

</body>
</html>
